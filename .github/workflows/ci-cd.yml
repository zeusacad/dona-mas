name: CI/CD Pipeline DonaMas

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:

  # =========================================================
  # 1. PRUEBAS + LINT + SONARQUBE
  # =========================================================
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar codigo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "18"
          cache: "npm"

      - name: Instalar dependencias
        run: npm ci

      - name: Ejecutar linting
        run: npm run lint

      - name: Ejecutar pruebas con cobertura
        run: npm test

      - name: Analisis de calidad con SonarQube Cloud
        uses: SonarSource/sonarqube-scan-action@v8
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}


  # =========================================================
  # 2. ESCANEO DE SEGURIDAD CON OWASP ZAP
  # =========================================================
  security-scan:
    needs: test
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Descargar codigo
        uses: actions/checkout@v4

      - name: Construir imagen Docker
        run: docker build -t donamas:scan .

      - name: Levantar el contenedor de prueba
        run: |
          docker run -d \
            --name donamas-app \
            -p 3000:3000 \
            -e JWT_SECRET=ci-scan-secret \
            donamas:scan

          sleep 5

          echo "Contenedor iniciado:"
          docker ps

      - name: Escaneo de seguridad con OWASP ZAP
        uses: zaproxy/action-baseline@v0.12.0
        with:
          target: "http://localhost:3000"
          cmd_options: ""
          allow_issue_writing: false
          fail_action: false

      - name: Subir reporte de ZAP como artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: zap-report
          path: |
            report_html.html
            report_json.json
            report_md.md
          if-no-files-found: warn

      - name: Detener contenedor de prueba
        if: always()
        run: |
          docker stop donamas-app || true
          docker rm donamas-app || true


  # =========================================================
  # 3. DEPLOY / GITHUB CONTAINER REGISTRY
  # =========================================================
  deploy:
    needs: [test, security-scan]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - name: Descargar codigo
        uses: actions/checkout@v4

      - name: Iniciar sesion en GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Construir y publicar imagen
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/donamas:${{ github.sha }}
            ghcr.io/${{ github.repository_owner }}/donamas:staging
